include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Style-only lints disabled project-wide.
    #
    # Why: the game logic in game_controller.dart relies heavily on compact
    # one-line `if (cond) action;` statements inside hot loops, and several
    # widget builders intentionally keep inline const literals for
    # readability. Requiring braces and `const` everywhere would bloat the
    # code without changing behavior. Silencing these keeps `flutter analyze`
    # focused on real issues (errors, potential runtime bugs, deprecations).
    curly_braces_in_flow_control_structures: ignore
    prefer_const_declarations: ignore
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore

linter:
  rules: