en: |
  Welcome to {appName}!

  🎮 THE BASICS:
  • Drag blocks from the tray onto the 8x8 board.
  • Fill an entire row or column to clear it and score points.

  🌌 THE GRAVITY RIFT:
  The glowing cross in the center of the board is the Rift.
  • When you clear a line, the Rift activates! The empty space creates a gravity pull that drags the remaining blocks along that row or column towards the glowing center cross.
  • This constantly shifts the board, closing the gaps and setting up unexpected cascading combos.
  • Clear a row and a column at the exact same time to form a CROSS. This triggers the ultimate Rift reaction and scores a massive x10 multiplier!

  🚀 BONUSES (BOOSTERS):
  Stuck? Use your Bonuses to keep the combo alive!
  • Hammer: Smash a single block.
  • New Blocks: Shuffle the pieces in your tray.
  • Surprise: Place a magical block with a random effect.
  • Hint: Shows you the best possible move.

  Pro Tip: Use the Gravity Rift to your advantage—clear lines to pull blocks together and set up your next big Cross Combo!

ru: |
  Добро пожаловать в {appName}!

  🎮 ОСНОВЫ:
  • Перетаскивайте блоки из лотка на поле 8x8.
  • Заполняйте целые ряды или столбцы для их очистки и получения очков.

  🌌 ГРАВИТАЦИОННЫЙ РАЗЛОМ (GRAVITY RIFT):
  Светящийся крест в центре поля — это и есть Разлом.
  • Когда вы очищаете линию, Разлом активируется! Освободившееся пространство создает гравитацию, которая стягивает оставшиеся блоки вдоль этого ряда или столбца к светящемуся центральному кресту.
  • Поле постоянно сдвигается, закрывая пустоты и создавая неожиданные каскадные комбо.
  • Очистите ряд и столбец одновременно, чтобы создать КРЕСТ. Это вызывает мощнейшую реакцию Разлома и приносит огромный множитель x10!

  🚀 БОНУСЫ (BOOSTERS):
  Зашли в тупик? Используйте Бонусы, чтобы продолжить!
  • Молот: Разбивает один блок.
  • Новые блоки: Меняет фигуры в вашем лотке.
  • Сюрприз: Устанавливает магический блок со случайным эффектом.
  • Подсказка: Показывает лучший возможный ход.

  Совет: Используйте Гравитационный Разлом с умом — очищайте линии, чтобы стянуть блоки вместе и подготовить почву для следующего Крест-комбо!