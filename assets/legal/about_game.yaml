en: |
  {appName} is a fresh twist on classic block puzzle games, combining relaxing drag-and-drop gameplay with a mind-bending Center Gravity mechanic.

  Place glowing crystals on the 8x8 board, clear lines, and watch the remaining blocks pull toward the central Gravity Rifts to trigger massive chain reactions!

  Whether you want to unwind after a long day or challenge your spatial logic, this free offline puzzle game offers endless strategic fun.

  ✨ KEY FEATURES:
  • 100% Offline Play: No Wi-Fi or internet connection required. Play anywhere.
  • Smart Adaptive Difficulty: The board dynamically adjusts to your skill level.
  • Auto-Save & Resume: Close the app anytime and pick up exactly where you left off.
  • Local Top Scores: Track your personal bests and climb your own leaderboard.
  • Satisfying Audio & Haptics: Crisp sound effects and responsive vibration feedback.

  Developed with passion by Studio 3T. Thank you for playing!
  Contact: vonnab.e.v@gmail.com

ru: |
  {appName} — это свежий взгляд на классические головоломки с блоками, сочетающий расслабляющий игровой процесс с перетаскиванием элементов и заставляющую поразмыслить механику «Центральной гравитации».

  Размещайте светящиеся кристаллы на поле 8x8, очищайте ряды и наблюдайте, как оставшиеся блоки тянутся к центральным Гравитационным Разломам, вызывая грандиозные цепные реакции!

  Хотите ли вы расслабиться после долгого дня или проверить свою пространственную логику, эта бесплатная офлайн-игра-головоломка подарит вам бесконечное стратегическое удовольствие.

  ✨ ОСНОВНЫЕ ОСОБЕННОСТИ:
  • 100% офлайн-режим: не требуется Wi-Fi или подключение к интернету. Играйте где угодно.
  • Интеллектуальная адаптивная сложность: поле динамически подстраивается под ваш уровень мастерства.
  • Автосохранение и возобновление: закрывайте приложение в любой момент и продолжайте игру с того места, где остановились.
  • Локальные рекорды: отслеживайте свои личные рекорды и поднимайтесь в собственной таблице лидеров.
  • Приятные звуковые эффекты и тактильная обратная связь: четкие звуковые эффекты и отзывчивая вибрация.

  Разработано с любовью студией Studio 3T. Спасибо, что играете!
  Контакты: vonnab.e.v@gmail.com

uk: |
  {appName} — це свіжий погляд на класичні ігри-головоломки з блоками, що поєднує розслаблюючий ігровий процес типу «перетягни та відпусти» з захоплюючою механікою «Центральної гравітації».

  Розміщуйте сяючі кристали на ігровому полі розміром 8x8, очищайте ряди та спостерігайте, як решта блоків тягнеться до центральних Гравітаційних Розломів, викликаючи грандіозні ланцюгові реакції!

  Незалежно від того, чи хочете ви розслабитися після довгого дня, чи випробувати свою просторову логіку, ця безкоштовна офлайн-гра-головоломка пропонує нескінченну стратегічну розвагу.

  ✨ ОСНОВНІ ОСОБЛИВОСТІ:
  • 100% офлайн-гра: не потрібні Wi-Fi чи підключення до Інтернету. Грайте де завгодно.
  • Розумна адаптивна складність: ігрове поле динамічно підлаштовується під ваш рівень майстерності.
  • Автозбереження та продовження гри: закривайте додаток у будь-який час і продовжуйте саме з того місця, де зупинилися.
  • Локальні рекорди: відстежуйте свої особисті рекорди та піднімайтеся у власному рейтингу.
  • Приємні звукові ефекти та вібрація: чіткі звукові ефекти та чутлива вібраційна зворотний зв’язок.

  Розроблено з любов’ю студією Studio 3T. Дякуємо, що граєте!
  Контакти: vonnab.e.v@gmail.com

de: |
  {appName} ist eine frische Variante klassischer Block-Puzzlespiele, die entspannendes Drag-and-Drop-Gameplay mit einer kniffligen „Zentrale Schwerkraft“-Mechanik kombiniert.

  Platziere leuchtende Kristalle auf dem 8x8-Spielfeld, räume Reihen ab und beobachte, wie die verbleibenden Blöcke zu den zentralen Schwerkraft-Rissen gezogen werden, um gewaltige Kettenreaktionen auszulösen!

  Egal, ob du dich nach einem langen Tag entspannen oder dein räumliches Vorstellungsvermögen herausfordern möchtest – dieses kostenlose Offline-Puzzlespiel bietet endlosen strategischen Spielspaß.

  ✨ HAUPTMERKMALE:
  • 100 % Offline-Spiel: Kein WLAN oder Internet erforderlich. Spiele überall.
  • Intelligente, adaptive Schwierigkeitsanpassung: Das Spielfeld passt sich dynamisch deinem Spielniveau an.
  • Automatisches Speichern und Fortsetzen: Schließe die App jederzeit und mache genau dort weiter, wo du aufgehört hast.
  • Lokale Bestlisten: Verfolge deine persönlichen Bestleistungen und klettere in deiner eigenen Rangliste nach oben.
  • Mitreißende Audio- und Haptik-Effekte: Knackige Soundeffekte und reaktionsschnelles Vibrationsfeedback.

  Mit Leidenschaft entwickelt von Studio 3T. Vielen Dank fürs Spielen!
  Kontakt: vonnab.e.v@gmail.com

es: |
  {appName} es una nueva versión de los clásicos juegos de rompecabezas de bloques, que combina una relajante mecánica de «arrastrar y soltar» con un ingenioso sistema de «gravedad central».

  ¡Coloca cristales brillantes en el tablero de 8x8, elimina filas y observa cómo los bloques restantes se ven atraídos hacia las grietas de gravedad centrales para desencadenar enormes reacciones en cadena!

  Tanto si quieres relajarte tras un largo día como si quieres poner a prueba tu lógica espacial, este juego de puzles gratuito y sin conexión ofrece diversión estratégica sin fin.

  ✨ CARACTERÍSTICAS PRINCIPALES:
  • Juego 100 % sin conexión: no se necesita Wi-Fi ni conexión a Internet. Juega en cualquier lugar.
  • Dificultad adaptativa inteligente: el tablero se ajusta dinámicamente a tu nivel de habilidad.
  • Guardado automático y reanudación: cierra la aplicación en cualquier momento y retoma la partida exactamente donde la dejaste.
  • Mejores puntuaciones locales: lleva un registro de tus mejores marcas y asciende en tu propia tabla de clasificación.
  • Sonido y sensaciones táctiles satisfactorios: efectos de sonido nítidos y retroalimentación por vibración muy sensible.

  Desarrollado con pasión por Studio 3T. ¡Gracias por jugar!
  Contacto: vonnab.e.v@gmail.com

fr: |
  {appName} revisite les jeux de puzzle classiques à base de blocs, en associant un gameplay relaxant de type « glisser-déposer » à un mécanisme de « gravité centrale » qui mettra votre esprit à rude épreuve.

  Placez des cristaux lumineux sur le plateau 8x8, éliminez des lignes et observez les blocs restants être attirés vers les failles gravitationnelles centrales pour déclencher d’énormes réactions en chaîne !

  Que vous souhaitiez vous détendre après une longue journée ou mettre votre logique spatiale à l’épreuve, ce jeu de puzzle gratuit et hors ligne vous offre un plaisir stratégique sans fin.

  ✨ PRINCIPALES CARACTÉRISTIQUES :
  • Jeu 100 % hors ligne : aucune connexion Wi-Fi ou Internet requise. Jouez où vous voulez.
  • Difficulté adaptative intelligente : le plateau s’adapte dynamiquement à votre niveau de compétence.
  • Sauvegarde automatique et reprise : fermez l’application à tout moment et reprenez exactement là où vous vous êtes arrêté.
  • Meilleurs scores locaux : suivez vos records personnels et grimpez dans votre propre classement.
  • Effets sonores et haptiques satisfaisants : des effets sonores nets et des vibrations réactives.

  Développé avec passion par Studio 3T. Merci de jouer à notre jeu !
  Contact : vonnab.e.v@gmail.com

pt: |
  O {appName} é uma nova versão dos clássicos jogos de quebra-cabeças de blocos, combinando uma jogabilidade relaxante do tipo «arrastar e largar» com uma mecânica alucinante de «Gravidade Central».

  Coloca cristais brilhantes no tabuleiro de 8x8, elimina linhas e observa os blocos restantes a serem atraídos para as Fendas de Gravidade centrais, desencadeando enormes reações em cadeia!

  Quer queiras descontrair após um longo dia ou desafiar a tua lógica espacial, este jogo de quebra-cabeças offline gratuito oferece diversão estratégica sem fim.

  ✨ CARACTERÍSTICAS PRINCIPAIS:
  • Jogo 100% offline: Não é necessária ligação Wi-Fi nem à Internet. Joga em qualquer lugar.
  • Dificuldade adaptativa inteligente: O tabuleiro ajusta-se dinamicamente ao teu nível de habilidade.
  • Gravação automática e retomada: Feche a aplicação a qualquer momento e retome exatamente onde parou.
  • Melhores pontuações locais: Acompanhe os seus recordes pessoais e suba na sua própria tabela de classificação.
  • Áudio e sensações táteis gratificantes: Efeitos sonoros nítidos e feedback de vibração responsivo.

  Desenvolvido com paixão pelo Studio 3T. Obrigado por jogar!
  Contacto: vonnab.e.v@gmail.com

id: |
  {appName} menghadirkan sentuhan baru pada game teka-teki balok klasik, dengan memadukan gameplay seret-dan-lepas yang menenangkan bersama mekanisme Pusat Gravitasi yang menantang akal.

  Tempatkan kristal bercahaya di papan 8x8, hapus baris, dan saksikan balok-balok yang tersisa tertarik ke arah Celah Gravitasi di tengah untuk memicu reaksi berantai yang dahsyat!

  Baik Anda ingin bersantai setelah hari yang panjang atau mengasah logika spasial, game teka-teki offline gratis ini menawarkan keseruan strategis tanpa batas.

  ✨ FITUR UTAMA:
  • 100% Offline: Tidak memerlukan Wi-Fi atau koneksi internet. Mainkan di mana saja.
  • Tingkat Kesulitan Adaptif Cerdas: Papan permainan menyesuaikan diri secara dinamis dengan tingkat keahlian Anda.
  • Simpan Otomatis & Lanjutkan: Tutup aplikasi kapan saja dan lanjutkan tepat dari titik terakhir Anda.
  • Skor Tertinggi Lokal: Lacak rekor pribadi Anda dan naik ke papan peringkat Anda sendiri.
  • Audio & Getaran yang Memuaskan: Efek suara yang jernih dan umpan balik getaran yang responsif.

  Dikembangkan dengan penuh semangat oleh Studio 3T. Terima kasih telah bermain!
  Kontak: vonnab.e.v@gmail.com

zh: |
  {appName} 对经典方块解谜游戏进行了全新演绎，将轻松惬意的拖放玩法与令人烧脑的“中心引力”机制相结合。

  将发光的晶体放置在 8x8 的棋盘上，消除整行，然后看着剩余的方块被中央的“引力裂缝”吸引，从而触发大规模的连锁反应！

  无论你是想在漫长的一天后放松身心，还是想挑战自己的空间逻辑思维，这款免费的离线益智游戏都能为你带来无尽的策略乐趣。

  ✨ 主要特色：
  • 100% 离线游玩：无需 Wi-Fi 或网络连接，随时随地畅玩。
  • 智能自适应难度：游戏板会根据你的技能水平动态调整难度。
  • 自动保存与续玩：随时关闭应用，次日可从上次中断处继续游戏。
  • 本地高分榜：追踪个人最佳成绩，在专属排行榜上一路攀升。
  • 令人沉醉的音效与触觉反馈：清脆的音效和灵敏的振动反馈。

  由 Studio 3T 倾情开发。感谢您的游玩！
  联系邮箱：vonnab.e.v@gmail.com

ja: |
  {appName}は、定番のブロックパズルゲームに斬新なひねりを加えた作品で、リラックスできるドラッグ＆ドロップのゲームプレイと、頭をひねる「中心重力」メカニズムを組み合わせています。

  8×8のボード上に輝くクリスタルを配置し、列を消して、残ったブロックが中央の「重力の裂け目」に向かって引き寄せられ、大規模な連鎖反応を引き起こす様子をご覧ください！

  長い一日の後にリラックスしたい時も、空間認識力を試したい時も、この無料のオフラインパズルゲームなら、戦略的な楽しみが尽きることがありません。

  ✨ 主な特徴：
  • 100% オフラインプレイ：Wi-Fi やインターネット接続は不要。どこでもプレイ可能。
  • スマートな難易度調整：ボードがプレイヤーのスキルレベルに合わせて動的に調整されます。
  • 自動保存＆再開：いつでもアプリを閉じても、中断した場所からそのまま再開できます。
  • ローカルハイスコア：自己ベストを記録し、自分だけのリーダーボードを駆け上がろう。
  • 心地よいサウンドとハプティック：クリアな効果音と反応の良い振動フィードバック。

  Studio 3Tが情熱を込めて開発しました。プレイしていただきありがとうございます！
  お問い合わせ：vonnab.e.v@gmail.com

ko: |
  {appName}은 고전적인 블록 퍼즐 게임에 신선한 변주를 더한 게임으로, 편안한 드래그 앤 드롭 방식의 게임플레이와 두뇌를 자극하는 ‘중심 중력’ 메커니즘을 결합했습니다.

  8x8 보드에 빛나는 크리스탈을 배치하고, 줄을 지워나가며, 남은 블록들이 중앙의 ‘중력 균열’ 쪽으로 끌려가면서 거대한 연쇄 반응을 일으키는 모습을 지켜보세요!

  긴 하루를 마치고 휴식을 취하고 싶거나 공간 지각 능력을 시험해 보고 싶다면, 이 무료 오프라인 퍼즐 게임이 끝없는 전략적 재미를 선사합니다.

  ✨ 주요 특징:
  • 100% 오프라인 플레이: Wi-Fi나 인터넷 연결이 필요 없습니다. 어디서나 플레이하세요.
  • 스마트 적응형 난이도: 보드가 플레이어의 실력 수준에 따라 동적으로 조정됩니다.
  • 자동 저장 및 재개: 언제든지 앱을 종료해도 중단한 지점부터 바로 이어서 플레이할 수 있습니다.
  • 로컬 최고 기록: 개인 최고 기록을 확인하고 나만의 리더보드 순위를 올릴 수 있습니다.
  • 만족스러운 사운드 및 햅틱 효과: 선명한 음향 효과와 반응성이 뛰어난 진동 피드백.

  Studio 3T가 열정을 담아 개발했습니다. 플레이해 주셔서 감사합니다!
  문의: vonnab.e.v@gmail.com

hi: |
  {appName} क्लासिक ब्लॉक पहेली खेलों पर एक नया मोड़ है, जो आरामदायक ड्रैग-एंड-ड्रॉप गेमप्ले को दिमाग घुमा देने वाले सेंटर ग्रेविटी मैकेनिक के साथ जोड़ता है।

  8x8 बोर्ड पर चमकते क्रिस्टल रखें, लाइनें साफ़ करें, और विशाल चेन रिएक्शन ट्रिगर करने के लिए बाकी बचे ब्लॉकों को केंद्रीय ग्रेविटी रिफ्ट्स की ओर खिंचते हुए देखें!

  चाहे आप एक लंबे दिन के बाद आराम करना चाहते हों या अपने स्थानिक तर्क को चुनौती देना चाहते हों, यह मुफ़्त ऑफ़लाइन पहेली गेम अंतहीन रणनीतिक मज़ा प्रदान करता है।

  ✨ मुख्य विशेषताएँ:
  • 100% ऑफ़लाइन प्ले: कोई वाई-फ़ाई या इंटरनेट कनेक्शन आवश्यक नहीं। कहीं भी खेलें।
  • स्मार्ट अनुकूली कठिनाई: बोर्ड आपके कौशल स्तर के अनुसार गतिशील रूप से समायोजित होता है।
  • ऑटो-सेव और रिज़्यूम: ऐप को कभी भी बंद करें और ठीक वहीं से फिर से शुरू करें जहाँ आप रुके थे।
  • स्थानीय टॉप स्कोर: अपने व्यक्तिगत सर्वश्रेष्ठ स्कोर को ट्रैक करें और अपने ही लीडरबोर्ड पर चढ़ें।
  • संतोषजनक ऑडियो और हैप्टिक्स: स्पष्ट ध्वनि प्रभाव और प्रतिक्रियाशील कंपन फीडबैक।

  स्टूडियो 3T द्वारा जुनून के साथ विकसित। खेलने के लिए धन्यवाद!
  संपर्क: vonnab.e.v@gmail.com