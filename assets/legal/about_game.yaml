en: |
  {appName} is a fresh, relaxing take on the classic block puzzle genre. Immerse yourself in a stunning neon cosmic atmosphere and challenge your brain with unique gravity mechanics!

  Unlike traditional puzzles, when you clear a line, surrounding blocks are pulled toward the center cross. This creates infinite new strategies and massive chain reactions.

  ✨ Features:
  • Unique Gravity Rift mechanics
  • Epic Cross Combos (x10 multiplier!)
  • Stunning neon visuals and cosmic backgrounds
  • Play offline anytime, anywhere
  • Smart Bonuses (Boosters) to save your game

  Developed with passion by Studio 3T. Thank you for playing!

  For legal details, please refer to the Terms of Service and Privacy Policy.
  Contact: vonnab.e.v@gmail.com

ru: |
  {appName} — это свежий и расслабляющий взгляд на классический жанр блок-пазлов. Погрузитесь в потрясающую неоновую космическую атмосферу и бросьте вызов своему мозгу с уникальной механикой гравитации!

  В отличие от традиционных головоломок, при очистке линии окружающие блоки притягиваются к центральному кресту. Это создает бесконечные новые стратегии и мощные цепные реакции.

  ✨ Особенности:
  • Уникальная механика Разлома (Гравитация)
  • Эпичные Крест-комбо (множитель x10!)
  • Потрясающий неоновый визуал и космические фоны
  • Играйте офлайн где угодно и когда угодно
  • Умные Бонусы (Boosters) для спасения игры

  Разработано с любовью студией Studio 3T. Спасибо за игру!

  Юридическая информация — в Условиях использования и Политике конфиденциальности.
  Контакты: vonnab.e.v@gmail.com